<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی جور کردنی</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            direction: rtl;
            background-color: #757474;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 20px auto;
        }
        .card {
            width: 100px;
            height: 100px;
            background-color: #3a54cc;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.3s, background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card:hover {
            transform: scale(1.1);
        }
        .flipped {
            background-color: white;
            color: black;
            border: 2px solid #007bff;
        }
        .matched {
            background-color: #28a745 !important;
            color: white;
        }
        .mismatch {
            background-color: red !important;
        }
    </style>
</head>
<body>
    <h1>تست</h1>
    <div class="grid" id="gameBoard"></div>
    <script>
        const pairs = [
            ["مهدی", "قائم"],
            ["انتظار", "ظهور"],
            ["عدالت", "ظلم‌زدایی"],
            ["یاران", "۳۱۳ نفر"],
            ["غیبت صغری", "69 سال"],
            ["غیبت کبری", "ادامه دارد"],
            ["امام دوازدهم", "امام زمان"],
            ["دعای فرج", "اللهم عجل لولیک الفرج"],
            ["محل تولد", "سامرا"],
            ["پدر امام زمان", "امام حسن عسگری"],
            ["مادر امام زمان", "نرجس خاتون"],
            ["منتظر واقعی", "عمل صالح"],
            ["نیمه شعبان", "جشن میلاد"],
            ["لقب دیگر", "بقیة‌الله"],
            ["محل زندگی در غیبت", "نامعلوم"],
            ["وظیفه شیعیان", "آمادگی برای ظهور"],
            ["زمان ظهور", "فقط خدا می‌داند"],
            ["اولین کلمه پس از ظهور", "یا أهل العالم"],
            ["پرچم امام زمان", "یا لثارات الحسین"],
            ["اصلی‌ترین دشمن امام زمان", "دجال"]
        ];

        let cards = pairs.flat().sort(() => Math.random() - 0.5);
        let gameBoard = document.getElementById("gameBoard");
        let flippedCards = [];
        let matchedPairs = 0;

        cards.forEach(text => {
            let card = document.createElement("div");
            card.classList.add("card");
            card.dataset.value = text;
            card.innerText = "?";
            card.addEventListener("click", () => flipCard(card));
            gameBoard.appendChild(card);
        });

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains("flipped")) {
                card.classList.add("flipped");
                card.innerText = card.dataset.value;
                flippedCards.push(card);
            }
            
            if (flippedCards.length === 2) {
                setTimeout(checkMatch, 800);
            }
        }

        function checkMatch() {
            let [card1, card2] = flippedCards;
            let pair = pairs.some(pair => pair.includes(card1.dataset.value) && pair.includes(card2.dataset.value));
            
            if (pair) {
                card1.classList.add("matched");
                card2.classList.add("matched");
                matchedPairs++;
                flippedCards = [];
                if (matchedPairs === pairs.length) {
                    alert("تبریک! شما تمام جفت‌ها را پیدا کردید.");
                }
            } else {
                card1.classList.add("mismatch");
                card2.classList.add("mismatch");
                setTimeout(() => {
                    card1.classList.remove("flipped", "mismatch");
                    card2.classList.remove("flipped", "mismatch");
                    card1.innerText = "?";
                    card2.innerText = "?";
                    flippedCards = [];
                }, 500);
            }
        }
    </script>
</body>
</html>
