<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی جور کردنی</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            direction: rtl;
            background-color: #889E73;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 20px auto;
        }
        .card {
            width: 100px;
            height: 100px;
            background-color: #FFF6DA;
            color: #889E73(160, 7, 7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.3s, background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card:hover {
            transform: scale(1.1);
        }
        .flipped {
            background-color: white;
            color: black;
            border: 2px solid #007bff;
        }
        .matched {
            background-color: #A9C46C !important;
            color: rgb(0, 0, 0);
        }
        .mismatch {
            background-color: #FF8383 !important;
        }
    </style>
</head>
<body>
    <h1>تست</h1>
    <div class="grid" id="gameBoard"></div>
 <script>
    const pairs = [
        ["تعداد یاران", "۳۱۳ نفر"],
        ["غیبت صغری", "69 سال"],
        ["غیبت کبری", "ادامه دارد"],
        ["محل تولد", "سامرا"],
        ["پدر امام زمان", "امام حسن عسگری"],
        ["مادر امام زمان", "نرجس خاتون"],
        ["محل ظهور", "کعبه"],
        ["شرط ظهور", "آمادگی مردم"],
        ["پرچم امام زمان", "یا لثارات الحسین"],
        ["اصلی‌ترین دشمن امام زمان", "دجال"]
    ];

    let cards = pairs.flat().sort(() => Math.random() - 0.5);
    let gameBoard = document.getElementById("gameBoard");
    let flippedCards = [];
    let matchedPairs = 0;

    cards.forEach((text, index) => {
        let card = document.createElement("div");
        card.classList.add("card");
        card.dataset.value = text;
        card.innerText = index + 1; // نمایش عدد به جای علامت سؤال
        card.dataset.index = index + 1; // ذخیره عدد برای استفاده مجدد
        card.addEventListener("click", () => flipCard(card));
        gameBoard.appendChild(card);
    });

    function flipCard(card) {
        if (flippedCards.length < 2 && !card.classList.contains("flipped")) {
            card.classList.add("flipped");
            card.innerText = card.dataset.value;
            flippedCards.push(card);
        }

        if (flippedCards.length === 2) {
            setTimeout(checkMatch, 800);
        }
    }

    function checkMatch() {
        let [card1, card2] = flippedCards;
        let pair = pairs.some(pair => pair.includes(card1.dataset.value) && pair.includes(card2.dataset.value));

        if (pair) {
            card1.classList.add("matched");
            card2.classList.add("matched");
            matchedPairs++;
            flippedCards = [];
            if (matchedPairs === pairs.length) {
                alert("تبریک! شما تمام جفت‌ها را پیدا کردید.");
            }
        } else {
            card1.classList.add("mismatch");
            card2.classList.add("mismatch");
            setTimeout(() => {
                card1.classList.remove("flipped", "mismatch");
                card2.classList.remove("flipped", "mismatch");
                card1.innerText = card1.dataset.index; // بازگرداندن عدد قبلی
                card2.innerText = card2.dataset.index; // بازگرداندن عدد قبلی
                flippedCards = [];
            }, 500);
        }
    }
</script>
</body>
</html>
